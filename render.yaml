# Render（https://render.com）に置く設計図。Dashboard → New → Blueprint でこのリポジトリを選ぶと、下の値を聞かれて 1 つのサービスができる。
# 無料枠: 15 分無操作で眠り、次の最初のアクセスだけ 30〜60 秒待つ。ディスクは保存されない（同梱の音声は Git にあるので問題ない。手元のキャッシュ _out は消える）。
services:
  - type: web
    name: jev-kano
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: PUBLIC
        value: "1"                 # 公開サーバー: 遊ぶ側の口にも 1 人・全体の回数上限
      - key: RELAY_DAILY_CAP
        value: "400"               # 全体で 1 日 400 手（≒ 40 ゲーム。言葉の生成だけを数える）
      - key: RELAY_PER_IP_10MIN
        value: "30"                # 1 人（IP）10 分 30 手
      - key: TTS_VOICE
        value: voice_n768ib2j6rqa  # 彼女の声（作者の Google プロジェクトの声。他の人が置くなら自分の声か Leda）
      - key: TYPESAFE_API_KEY
        sync: false                # 置く人が Dashboard で入れる（Git には入らない）
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # - key: LLM_MODEL
      #   value: claude-sonnet-5   # 費用を抑えるなら
