<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#Jevカノ</title>
<meta name="description" content="判断特化AI Jev が本音を0.2秒で決め、顔と一言が先に出る恋愛ADV。言葉は Claude、声は Gemini。">
<meta property="og:title" content="#Jevカノ">
<meta property="og:description" content="顔が0.2秒で動いて、言葉はあとから来る。Jev × Claude × Gemini の恋愛ADV。鍵なしで遊べます。">
<meta property="og:image" content="https://ozaki-taisuke.github.io/jev-kano/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#2a2d3f; --sub:#6b6f85; --accent:#e8834a; --accent2:#f0a35a; --ok:#3aa76d; --warn:#c77d12; --bad:#d9534f;
    --jev:#3b82c6; --llm:#e8834a; --line:rgba(120,90,60,.22); --panel:rgba(255,251,244,.90); --panel-solid:#fffbf3; --chip:rgba(255,255,255,.7); --field:rgba(255,255,255,.85);
    --win:220px; --stage:min(56vh, 460px);
    --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
    --logo:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:#3a2a2a; color:var(--ink); font-family:var(--font); font-size:15px; overflow:hidden; }
  /* 背景の絵 */
  .bg { position:fixed; inset:0; background:#4a3a3a center/cover no-repeat; transition:filter .8s; z-index:0; }
  .bg::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.08) 0%, rgba(0,0,0,0) 30%, rgba(30,20,30,.35) 100%); }
  body.ep-blackout .bg { filter:brightness(.38) saturate(.6) hue-rotate(-20deg); }
  body.ep-wings .bg { filter:brightness(.45) saturate(.7) hue-rotate(20deg) contrast(1.1); }
  /* 上の帯 */
  .hud { position:fixed; left:0; right:0; top:0; z-index:6; display:flex; flex-wrap:wrap; row-gap:4px; align-items:center; gap:10px; padding:8px 14px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5); pointer-events:none; }
  .hud > * { pointer-events:auto; white-space:nowrap; }
  @media (max-width:900px) { .hud { gap:6px; padding:6px 8px; } .hud .gauge .bar { width:70px; } .hud .stat, .hud button, .hud label, .hud .gauge { padding-left:8px; padding-right:8px; } }
  @media (max-width:600px) { .hud { flex-wrap:wrap; row-gap:4px; } .hud .mini { display:none; } .hud .sp { display:none; } .hud .gauge .bar { width:56px; } .hud .stat, .hud button, .hud label, .hud .gauge { font-size:11px; padding:3px 8px; } }
  .hud .mini { height:34px; width:auto; --sw1:22; --sw2:10; filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .hud .sp { flex:1; }
  .hud .gauge { display:flex; align-items:center; gap:8px; font-size:12px; background:rgba(30,25,40,.45); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:4px 12px 4px 10px; backdrop-filter:blur(6px); }
  .hud .gauge .bar { width:110px; height:8px; background:rgba(255,255,255,.25); border-radius:6px; overflow:hidden; }
  .hud .gauge .bar i { display:block; height:100%; background:linear-gradient(90deg, #ffb37a, #ff6f91); width:50%; transition:width .35s; }
  .hud .stat { font-size:12px; background:rgba(30,25,40,.45); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:4px 12px; backdrop-filter:blur(6px); white-space:nowrap; }
  .hud .stat b { font-weight:600; margin-left:4px; }
  .hud button, .hud label { font:inherit; font-size:12px; color:#fff; background:rgba(30,25,40,.45); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:4px 12px; cursor:pointer; backdrop-filter:blur(6px); display:inline-flex; align-items:center; gap:5px; }
  .hud button:hover, .hud label:hover { border-color:#fff; }
  .hud .models { font-size:11px; opacity:.85; }
  .notice { position:fixed; left:50%; top:calc(var(--hud, 44px) + 8px); transform:translateX(-50%); z-index:6; font-size:12px; color:#fff; background:rgba(199,125,18,.85); border-radius:999px; padding:4px 12px; max-width:90vw; text-align:center; }
  .notice:empty { display:none; }
  /* 立ち絵 */
  /* 立ち絵の大きさと位置は JS（fitWin）が決める: 縦が足りないときは縮めずに、下 4 割までメッセージ窓の後ろに隠す */
  .stage { position:fixed; z-index:2; width:var(--stage); height:var(--stage); left:max(4vw, calc(50vw - 560px)); bottom:var(--stage-bottom, var(--win)); }
  @media (max-width:800px) { .stage { left:50%; transform:translateX(-50%); } }
  .stage svg, .stage img.photo { width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 10px 18px rgba(0,0,0,.35)); }
  .stage img.photo.framed { border-radius:18px; border:2px solid rgba(255,255,255,.75); box-shadow:0 12px 30px rgba(0,0,0,.35); }
  #photoZones { position:absolute; inset:0; }
  .pz { position:absolute; border-radius:45%; cursor:pointer; background:radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 70%); opacity:0; transition:opacity .15s; }
  .pz:hover { opacity:.35; }
  .pz.warn:hover { background:radial-gradient(circle, rgba(255,107,107,.9), rgba(255,107,107,0) 70%); }
  .zone { fill:#fff; fill-opacity:0; transition:fill-opacity .15s; } .zone:hover { fill-opacity:.16; }
  .zoneTip { position:absolute; left:50%; bottom:8px; transform:translateX(-50%); font-size:12px; color:var(--jev); background:rgba(255,253,248,.94); border:1px solid var(--line); border-radius:999px; padding:2px 10px; pointer-events:none; opacity:0; transition:opacity .15s; white-space:nowrap; }
  .zoneTip.on { opacity:1; }
  .pop { animation:pop .28s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes pop { 0% { transform:scale(.985) translateY(3px); } 100% { transform:scale(1) translateY(0); } }
  @media (max-width:800px) { .pop { animation-name:popM; } @keyframes popM { 0% { transform:translateX(-50%) scale(.985); } 100% { transform:translateX(-50%) scale(1); } } }
  .lid { animation:blink 4.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 40%; }
  @keyframes blink { 0%,95.5%,100% { transform:scaleY(1); } 97.5% { transform:scaleY(.06); } }
  /* メッセージ窓（下） */
  .msgwin { position:fixed; left:50%; bottom:calc(var(--clock, 30px) + 8px); transform:translateX(-50%); width:min(1120px, calc(100vw - 20px)); z-index:5; background:var(--panel); border:1px solid rgba(255,255,255,.8); box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 0 0 1px var(--line); border-radius:18px; backdrop-filter:blur(10px); padding:14px 18px 12px; }
  .msgwin .prev { font-size:12px; color:var(--sub); height:1.5em; line-height:1.5; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msgwin .plate { display:inline-block; font-family:var(--logo); font-weight:700; font-size:14px; letter-spacing:.08em; color:#fff; background:linear-gradient(90deg, var(--accent), #ff6f91); border-radius:999px; padding:2px 14px; margin-bottom:6px; box-shadow:0 2px 6px rgba(232,131,74,.35); }
  .msgwin .plate.me { background:linear-gradient(90deg, #5aa0e0, var(--jev)); box-shadow:0 2px 6px rgba(59,130,198,.35); }
  .msgwin .plate:empty { display:none; }
  .msgwin .text { font-size:17px; line-height:1.75; height:6rem; overflow-y:auto; scrollbar-gutter:stable; padding-right:6px; white-space:pre-wrap; }
  @media (max-height:700px) { .msgwin .text { height:4rem; } }
  @media (max-width:800px) { .msgwin .text { height:7.6rem; font-size:16px; } }
  .msgwin .text.narr { color:#4a4658; font-size:15px; font-style:italic; }
  .msgwin .text .say { color:var(--jev); display:block; }
  .msgwin .text .line { display:block; margin-top:.5em; animation:fadeIn .35s ease-out; }
  .msgwin .text.pending { color:var(--sub); }
  .msgwin .next { text-align:right; color:var(--accent); font-size:13px; height:1.3em; line-height:1.3; cursor:pointer; animation:bob 1.1s ease-in-out infinite; }
  .msgwin .next.off { visibility:hidden; animation:none; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(3px); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  .msgwin .dock { border-top:1px dashed var(--line); margin-top:10px; padding-top:8px; display:flex; flex-direction:column; gap:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chips .lbl { font-size:12px; color:var(--sub); margin-right:2px; }
  .chips button { background:var(--chip); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .chips button:hover { border-color:var(--accent); background:#fff; }
  .row2 { display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--field); color:var(--ink); padding:8px 10px; font:inherit; }
  textarea:focus { outline:1px solid var(--accent); }
  button.send { background:linear-gradient(180deg, var(--accent2), var(--accent)); color:#fff; border:0; border-radius:10px; padding:0 20px; font:inherit; font-weight:700; cursor:pointer; box-shadow:0 2px 6px rgba(232,131,74,.4); }
  button.send:disabled { opacity:.5; cursor:default; box-shadow:none; }
  @media (max-height:560px) { .chips { display:none; } }
  /* 記録（ログ）・遊び方・結末 */
  .modal { position:fixed; inset:0; background:rgba(20,16,30,.6); display:none; align-items:center; justify-content:center; padding:20px; z-index:30; overflow:auto; }
  .modal .box { background:var(--panel-solid); border:1px solid var(--line); border-radius:16px; padding:22px 24px; max-width:680px; width:100%; max-height:90vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .modal h3 { margin:0 0 10px; font-family:var(--logo); font-size:18px; color:var(--accent); }
  .modal dl { margin:0; }
  .modal dt { color:var(--accent2); font-weight:600; margin-top:10px; font-size:13px; }
  .modal dd { margin:2px 0 0; line-height:1.7; font-size:14px; }
  .modal .close { margin-top:14px; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:8px 18px; font:inherit; font-weight:700; cursor:pointer; }
  .modal label { display:block; margin-top:12px; color:var(--sub); font-size:13px; }
  .log { display:flex; flex-direction:column; gap:10px; min-height:120px; }
  .msg { padding:10px 12px; border-radius:12px; max-width:92%; line-height:1.6; white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:#e6f0fb; }
  .msg.user.act { background:transparent; border:1px dashed var(--line); color:var(--sub); }
  .msg.her { align-self:flex-start; background:#fff1e4; border-left:3px solid var(--accent); }
  .msg.her.pending { color:var(--sub); font-style:italic; }
  .msg.her .say { color:var(--jev); display:block; }
  .msg.her .line { display:block; margin-top:.9em; }
  .msg.intro { align-self:stretch; max-width:none; background:#f6efe4; border:1px dashed var(--line); color:var(--sub); font-size:13px; line-height:1.7; }
  .meta { font-size:12px; color:var(--sub); display:flex; flex-wrap:wrap; gap:6px 12px; align-self:flex-start; padding-left:4px; align-items:center; }
  .meta b { color:var(--ink); font-weight:500; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; border:1px solid var(--line); }
  .tag.bad { border-color:var(--bad); color:var(--bad); }
  .ending { position:fixed; inset:0; background:rgba(20,16,30,.62); display:none; align-items:center; justify-content:center; padding:20px; z-index:9; }
  .ending .box { background:var(--panel-solid); border:1px solid var(--line); border-radius:18px; padding:28px 26px; max-width:540px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .ending h2 { margin:0 0 8px; font-family:var(--logo); font-size:22px; color:var(--accent); }
  .ending p { margin:8px 0; line-height:1.8; }
  .ending button { margin-top:10px; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:9px 20px; font:inherit; font-weight:700; cursor:pointer; }
  .ending.perfect .box { border-color:var(--accent2); box-shadow:0 0 60px rgba(255,179,122,.55); }
  .ending.perfect h2 { color:#ff6f91; }
  /* 数字はデバッグ表示のときだけ */
  .dbg { display:none !important; }
  body.debug .dbg { display:revert !important; }
  body.debug .dbg.row { display:flex !important; }
  body.debug .meta.dbg { display:flex !important; }
  body.debug label.dbg { display:inline-flex !important; }
  /* この手の応答時間（台詞ウインドウとは別。右上の HUD の下） */
  .clock { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; flex-wrap:wrap; justify-content:center; gap:3px 14px; font-variant-numeric:tabular-nums; font-size:12px; color:#fff; background:rgba(30,25,40,.72); border-top:1px solid rgba(255,255,255,.18); padding:4px 12px; backdrop-filter:blur(6px); transition:opacity .3s; }
  .clock.idle { opacity:.55; }
  .clock .seg { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .clock .who { font-family:var(--logo); font-weight:700; font-size:11px; letter-spacing:.04em; padding:0 7px; border-radius:999px; background:rgba(255,255,255,.14); }
  .clock .who.jev { color:#bfe6ff; } .clock .who.llm { color:#ffd0a8; } .clock .who.tts { color:#eee; }
  .clock .lbl { opacity:.85; }
  .clock .val { font-size:13px; min-width:3.6em; text-align:right; }
  .clock .val.run { color:#ffd27a; } .clock .val.jev { color:#9fd3ff; } .clock .val.llm { color:#ffb37a; }
  .clock .track { width:46px; height:5px; background:rgba(255,255,255,.2); border-radius:3px; position:relative; overflow:hidden; }
  .clock .track i { position:absolute; left:0; top:0; height:100%; width:0; background:currentColor; opacity:.85; }
  .clock .mood { flex-basis:100%; text-align:right; font-size:12px; color:#fff; }
  .mood b { color:#9fd3ff; font-weight:600; } .mood b.llm { color:#ffb37a; }
  @media (max-width:600px) { .clock { gap:3px 8px; padding:3px 8px; } .clock .track { display:none; } }
  .toast { position:fixed; left:50%; top:calc(var(--hud, 44px) + 44px); transform:translateX(-50%); background:#fff; border:1px solid var(--accent2); color:var(--accent2); border-radius:999px; padding:6px 14px; font-size:13px; z-index:40; animation:toastIn 2.6s ease-out forwards; }
  @keyframes toastIn { 0% { opacity:0; transform:translate(-50%,-6px); } 12% { opacity:1; transform:translate(-50%,0); } 80% { opacity:1; } 100% { opacity:0; } }
  .foot { position:fixed; left:0; right:0; bottom:var(--clock, 30px); color:#fff; font-size:11px; padding:4px 10px; background:rgba(0,0,0,.4); z-index:7; }
  /* 開始画面 */
  body.on-title .hud, body.on-title .msgwin, body.on-title .stage, body.on-title .clock, body.on-title .notice { display:none !important; }
  .title { position:fixed; inset:0; z-index:20; overflow:auto; display:flex; flex-direction:column; align-items:center; padding:min(6vh, 48px) 16px 24px; background:linear-gradient(180deg, rgba(20,14,26,.25), rgba(20,14,26,.55)); }
  .title > * { flex-shrink:0; }
  .title .logo { width:min(88vw, 620px); height:auto; margin:0 auto 4px; display:block; filter:drop-shadow(0 8px 14px rgba(0,0,0,.45)); animation:logoIn 1s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes logoIn { 0% { opacity:0; transform:scale(.92) translateY(10px); } 100% { opacity:1; transform:none; } }
  .title .sub { color:#fff; font-family:var(--logo); font-weight:700; letter-spacing:.14em; font-size:14px; text-shadow:0 1px 3px rgba(0,0,0,.6); margin-bottom:18px; background:rgba(30,25,40,.35); border-radius:999px; padding:4px 16px; }
  .title .box { max-width:600px; width:100%; background:var(--panel); border:1px solid rgba(255,255,255,.8); border-radius:18px; padding:20px 24px; backdrop-filter:blur(10px); box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .title h2 { position:absolute; left:-9999px; }
  .title p.intro { line-height:1.8; font-size:14px; color:var(--ink); background:rgba(255,255,255,.6); border:1px dashed var(--line); border-radius:12px; padding:12px 14px; margin:0 0 6px; }
  .title p.goal { line-height:1.7; font-size:13px; color:#b3541e; margin:14px 0 0; padding:8px 14px; border-left:3px solid var(--accent2); }
  .title input:disabled { color:var(--sub); background:rgba(230,224,214,.7); cursor:not-allowed; }
  .title .cols { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  @media (max-width:560px) { .title .cols { grid-template-columns:1fr; } }
  .title label.f { display:block; margin:12px 0 4px; color:var(--sub); font-size:12px; letter-spacing:.06em; }
  .title input, .title select { width:100%; border-radius:10px; border:1px solid var(--line); background:var(--field); color:var(--ink); padding:9px 10px; font:inherit; }
  .title .start { margin-top:18px; width:100%; background:linear-gradient(180deg, var(--accent2), var(--accent)); color:#fff; border:0; border-radius:12px; padding:13px; font-family:var(--logo); font-weight:900; font-size:17px; letter-spacing:.2em; cursor:pointer; box-shadow:0 6px 18px rgba(232,131,74,.45); }
  .title .start:hover { filter:brightness(1.06); }
  .title .note { color:var(--sub); font-size:11px; margin-top:12px; line-height:1.6; }
  .title .credit { color:#fff; opacity:.8; font-size:11px; margin-top:14px; text-shadow:0 1px 2px rgba(0,0,0,.6); }
</style>
</head>
<body class="on-title">
<div class="bg" id="bg"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gJev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe6ff"/><stop offset=".5" stop-color="#63a9ea"/><stop offset="1" stop-color="#2d6fb3"/></linearGradient>
      <linearGradient id="gKano" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd39a"/><stop offset=".5" stop-color="#ff8c5a"/><stop offset="1" stop-color="#e64f74"/></linearGradient>
      <g id="logoText" font-family="'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic UI',sans-serif" font-weight="900" font-size="128" text-anchor="middle" transform="rotate(-2.5 320 120)">
        <text x="320" y="150" stroke="#2a2d3f" style="stroke-width:var(--sw1,30)" stroke-linejoin="round" fill="none">#Jevカノ</text>
        <text x="320" y="150" stroke="#fff" style="stroke-width:var(--sw2,16)" stroke-linejoin="round" fill="none">#Jevカノ</text>
        <text x="320" y="150"><tspan fill="url(#gJev)">#Jev</tspan><tspan fill="url(#gKano)">カノ</tspan></text>
        <g fill="#fff" stroke="#2a2d3f" stroke-width="3" stroke-linejoin="round">
          <path d="M556 42 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 Z"/>
          <path d="M96 150 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z"/>
        </g>
        <path d="M596 108 c-6 -10 -20 -4 -14 8 c3 6 14 14 14 14 s11 -8 14 -14 c6 -12 -8 -18 -14 -8 Z" fill="#ff6f91" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      </g>
    </defs>
</svg>

<div class="hud">
  <svg class="mini" viewBox="0 0 640 200" aria-hidden="true"><use href="#logoText"/></svg>
  <h1 id="appTitle" style="position:absolute;left:-9999px">#Jevカノ</h1>
  <span class="sp"></span>
  <label class="dbg"><input type="radio" name="mode" value="reflex" checked> 反射</label>
  <label class="dbg"><input type="radio" name="mode" value="llm"> LLM だけ</label>
  <span class="models dbg" id="models"></span>
  <div class="gauge"><span>親しさ</span><div class="bar"><i id="affBar"></i></div><span class="dbg" id="affNum">50</span></div>
  <span class="stat">片付け<b id="turnsLeft">—</b></span>
  <span class="stat" id="topicsStat" style="display:none">話題<b id="topics"></b></span>
  <button type="button" id="logBtn" title="これまでの会話">ログ</button>
  <label id="voiceLabel"><input type="checkbox" id="voice" checked> <span id="voiceText">声</span></label>
  <button type="button" id="helpBtn" title="遊び方">？</button>
  <button type="button" id="quitBtn" title="タイトルに戻る">やめる</button>
  <label class="dbg"><input type="checkbox" id="debugToggle" checked> デバッグ</label>
  <span id="sfxState" style="font-size:11px;color:#ffd27a"></span>
</div>

<script>
const MOOD_JA = { joy:'嬉しい', shy:'照れる', puzzled:'困る', upset:'不機嫌', calm:'平静' };
const TOPIC_JA = { book:'本', cook:'料理', stage:'明日のステージ', circle:'サークル' };
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const FACES = {
  joy:     { closed:true,  irisDx:0,  irisDy:0,  eyeSy:1,   browL:'M-48 -32 Q-34 -39 -16 -33', browR:'M16 -33 Q34 -39 48 -32', mouth:'M-14 52 Q0 68 14 52 Z', mouthFill:'#d9536f', blush:.55, lines:0, sweat:0, anger:0, sparkle:1, dots:0 },
  shy:     { closed:false, irisDx:7,  irisDy:3,  eyeSy:.9,  browL:'M-48 -22 Q-34 -30 -16 -26', browR:'M16 -26 Q34 -30 48 -22', mouth:'M-6 56 Q-3 52 0 56 Q3 60 6 56', mouthFill:'none', blush:1, lines:1, sweat:0, anger:0, sparkle:0, dots:1 },
  puzzled: { closed:false, irisDx:-4, irisDy:2,  eyeSy:1,   browL:'M-48 -24 Q-34 -30 -16 -29', browR:'M16 -36 Q34 -40 48 -28', mouth:'M-8 57 Q-4 52 0 57 Q4 62 8 57', mouthFill:'none', blush:0, lines:0, sweat:1, anger:0, sparkle:0, dots:0 },
  upset:   { closed:false, irisDx:0,  irisDy:-1, eyeSy:.66, browL:'M-48 -36 Q-34 -30 -16 -22', browR:'M16 -22 Q34 -30 48 -36', mouth:'M-9 59 Q0 52 9 59', mouthFill:'none', blush:0, lines:0, sweat:0, anger:1, sparkle:0, dots:0 },
  calm:    { closed:false, irisDx:0,  irisDy:0,  eyeSy:1,   browL:'M-48 -26 Q-34 -33 -16 -27', browR:'M16 -27 Q34 -33 48 -26', mouth:'M-7 55 Q0 59 7 55', mouthFill:'none', blush:0, lines:0, sweat:0, anger:0, sparkle:0, dots:0 },
};
const $ = (id) => document.getElementById(id);
const MEM_KEY = 'jevkano_memory';
function memGet() { try { return JSON.parse(localStorage.getItem(MEM_KEY) || '{}'); } catch { return {}; } }
function memSet(m) { try { localStorage.setItem(MEM_KEY, JSON.stringify(m)); } catch {} }
function memMark(episodeId, kind) { const m = memGet(); m.seen = m.seen || {}; m.seen[episodeId] = m.seen[episodeId] || {}; m.seen[episodeId][kind] = (m.seen[episodeId][kind] || 0) + 1; if (kind === 'perfect') m.perfect = true; memSet(m); }
function episodeDone(episodeId) { const s = (memGet().seen || {})[episodeId]; return !!s && Object.keys(s).length > 0; }
/** 鍵のかかった はじまり が開いているか: パーフェクトを一度出す、または 鍵のない はじまり すべてで「達成」以上。?debug=1 のときは選べる（確認用） */
function episodesUnlocked(eps, mem = memGet()) {
  if (mem.perfect || document.body.classList.contains('debug')) return true;
  const open = eps.filter((e) => !e.locked); if (!open.length) return false;
  return open.every((e) => { const s = (mem.seen || {})[e.id] || {}; return (s.good || 0) + (s.perfect || 0) > 0; });
}
const UNLOCK_HOW = 'パーフェクト、または 4 つすべてで達成';
let cfg, S;

// ---- 立ち絵: 背景が一様な緑の絵を、画面側で透明にして背景の上に立たせる ----
const CUT = {}; // 'shy_strong' → data URL（透明 PNG）
function cutout(url) {
  return new Promise((res) => {
    const im = new Image(); im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; const x = c.getContext('2d'); x.drawImage(im, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height); const p = d.data;
        for (let i = 0; i < p.length; i += 4) {
          const r = p[i], g = p[i + 1], b = p[i + 2]; const m = Math.max(r, b); const gn = g - m; // 緑の勝ち具合
          if (gn > 12) { const a = gn < 30 ? 1 : gn > 96 ? 0 : 1 - (gn - 30) / 66; p[i + 3] = Math.round(p[i + 3] * a); p[i + 1] = m; }
        }
        x.putImageData(d, 0, 0); res(c.toDataURL('image/png'));
      } catch { res(null); }
    }; im.onerror = () => res(null); im.src = url;
  });
}
async function prepareCutouts() {
  const g = cfg.faces && cfg.faces.green; if (!g) return;
  await Promise.all(Object.entries(g).map(async ([k, url]) => { const d = await cutout(url); if (d) CUT[k] = d; }));
  if (S) setFace(S.face || 'calm', null, { quiet: true, tier: S.faceTier });
}
const TIER_JA = ['弱', '中', '強'];
/** 絵の名前を選ぶ: 本音 + 段階（強→ _strong、中→ _mid。無ければ一つ下）+ はじまり（_scores など、その回の絵があれば） */
function faceKey(mood, tier) {
  const has = (k) => !!(cfg && cfg.faces && (cfg.faces[k] || (cfg.faces.green || {})[k]));
  const ep = S && S.episode && S.episode.id; const sufs = tier >= 2 ? ['_strong', '_mid', ''] : tier === 1 ? ['_mid', ''] : [''];
  for (const suf of sufs) { if (ep && has(mood + suf + '_' + ep)) return mood + suf + '_' + ep; if (has(mood + suf)) return mood + suf; }
  return mood;
}
function setFace(mood, label, { quiet = false, strong = false, tier } = {}) {
  const f = FACES[mood] || FACES.calm; tier = tier ?? (strong ? 2 : 0);
  if (S) { S.face = mood; S.faceTier = tier; }
  const key = faceKey(mood, tier);
  const cut = CUT[key] || CUT[mood] || null;
  const img = cut || (cfg && cfg.faces && (cfg.faces[key] || cfg.faces[mood]));
  if (img) { $('facePhoto').src = img; $('facePhoto').classList.toggle('framed', !cut); $('facePhoto').style.display = ''; $('photoZones').style.display = ''; $('faceSvg').style.display = 'none'; }
  else {
    $('facePhoto').style.display = 'none'; $('photoZones').style.display = 'none'; $('faceSvg').style.display = '';
    $('eyesOpen').setAttribute('opacity', f.closed ? 0 : 1); $('eyesClosed').setAttribute('opacity', f.closed ? 1 : 0);
    $('eyeGL').setAttribute('transform', 'translate(-31 12) scale(1 ' + f.eyeSy + ')'); $('eyeGR').setAttribute('transform', 'translate(31 12) scale(1 ' + f.eyeSy + ')');
    $('irisL').setAttribute('transform', 'translate(' + f.irisDx + ' ' + f.irisDy + ')'); $('irisR').setAttribute('transform', 'translate(' + f.irisDx + ' ' + f.irisDy + ')');
    $('browL').setAttribute('d', f.browL); $('browR').setAttribute('d', f.browR);
    $('mouth').setAttribute('d', f.mouth); $('mouth').setAttribute('fill', f.mouthFill);
    $('blushL').setAttribute('opacity', f.blush); $('blushR').setAttribute('opacity', f.blush); $('blushLines').setAttribute('opacity', f.lines || 0);
    $('sweat').setAttribute('opacity', f.sweat); $('anger').setAttribute('opacity', f.anger); $('sparkle').setAttribute('opacity', f.sparkle); $('dots').setAttribute('opacity', f.dots);
  }
  if (!quiet) { $('moodText').innerHTML = label || '&nbsp;'; const st = $('stage'); st.classList.remove('pop'); void st.offsetWidth; st.classList.add('pop'); }
}
function setAff(v) { S.affection = Math.max(0, Math.min(100, v)); $('affBar').style.width = S.affection + '%'; $('affNum').textContent = S.affection; }
function add(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; $('log').appendChild(d); scrollDown(); return d; }
function meta(html) { const d = document.createElement('div'); d.className = 'meta dbg'; d.innerHTML = html; $('log').appendChild(d); return d; }
function scrollDown() { const b = $('backlog'); if (b.style.display === 'flex') b.querySelector('.box').scrollTop = 1e9; }
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sec = (ms) => (ms / 1000).toFixed(2) + ' s';
const notice = (t) => { $('notice').textContent = t || ''; };
const plain = (t) => String(t || '').replace(/<[a-z -]+>/g, '').replace(/\s{2,}/g, ' ').trim(); // 声用のタグを外す
const mode = () => document.querySelector('input[name=mode]:checked').value;

// ---- メッセージ窓: 記録（ログ）の最後の吹き出しを映す ----
function renderWin() {
  const items = [...$('log').querySelectorAll('.msg')]; const last = items[items.length - 1]; if (!last) return;
  const txt = $('winText'), plate = $('winName'), prev = $('winPrev');
  txt.classList.toggle('pending', last.classList.contains('pending'));
  txt.classList.toggle('narr', last.classList.contains('intro'));
  if (last.classList.contains('intro')) { plate.textContent = last.classList.contains('mono') && S ? S.playerName : ''; plate.className = 'plate me'; prev.textContent = ''; txt.textContent = last.textContent; $('winNext').classList.toggle('off', !(S && S.waitOpen)); return; }
  $('winNext').classList.add('off');
  if (last.classList.contains('user')) { plate.textContent = S ? S.playerName : ''; plate.className = 'plate me'; prev.textContent = ''; txt.textContent = last.textContent; return; }
  plate.textContent = S ? S.heroineName : ''; plate.className = 'plate';
  const before = items[items.length - 2];
  prev.textContent = before && before.classList.contains('user') ? (S ? S.playerName : 'あなた') + '「' + before.textContent + '」' : '';
  txt.innerHTML = last.innerHTML;
}
new MutationObserver(renderWin).observe($('log'), { childList: true, subtree: true, characterData: true });
function fitWin() {
  const R = document.documentElement.style, hud = document.querySelector('.hud').offsetHeight, clockH = $('clock').offsetHeight, win = $('win').offsetHeight + clockH + 18;
  R.setProperty('--clock', clockH + 'px'); R.setProperty('--win', win + 'px'); R.setProperty('--hud', hud + 'px');
  // 立ち絵: 望む大きさは高さの 82%（最大 600px）。窓の上に入りきらなければ、縮める前に下 38% までを窓の後ろに隠す
  const want = Math.min(600, innerHeight * 0.82, innerWidth <= 800 ? innerWidth * 0.88 : 1e9);
  const space = innerHeight - hud - 10 - win;
  let h = want, overlap = 0;
  if (space < want) { h = Math.max(260, Math.min(want, space / 0.62)); overlap = Math.max(0, h - space); }
  R.setProperty('--stage', Math.round(h) + 'px'); R.setProperty('--stage-bottom', Math.round(win - overlap) + 'px');

  const ini = cfg.scenario.initiative || {};
  const band = (ini.bands || []).find((b) => S.affection >= b && !S.bandsDone.includes(b));
  const wantInitiative = !endKind && S.turn < cfg.scenario.maxTurns && S.turn - S.lastInitiativeTurn >= 2 && (band != null || (S.affection >= (ini.minAffection || 60) && Math.random() < (ini.chance || 0)));
  if (band != null) S.bandsDone.push(band);
  // 3. 声: 台詞を本音の色で読む
  if ($('voice').checked && w && lineVoice) {
    try {
      rec.tts = await speak(lineVoice, j ? j.mood : w.mood, () => { rec.tVoice = Math.round(performance.now() - t0); clockMark('Voice', rec.tVoice); }, { kind: action ? 'action' : 'line', intensity: j ? (j.moodProbs[j.mood] || null) : null, affection: S.affection });
      if (rec.tts && rec.tts.kind === 'none') { clockMark('Voice', null); $('cVoice').textContent = '字幕'; } // 字幕モード: 声の時間は出さない
      else if (rec.tVoice == null) { rec.tVoice = Math.round(performance.now() - t0); clockMark('Voice', rec.tVoice); }
    } catch (e) { rec.ttsError = e.message; clockMark('Voice', null); }
    metaEl.innerHTML = tl();
  } else clockMark('Voice', null);

  // 4. 彼女から振るのは、返事の声が鳴り終わってから（返事の文字を上書きしない）。その間に次の手が送られたらやめる
  if (wantInitiative) { const waitMs = rec.tts && rec.tts.kind !== 'none' ? Math.max(400, (playing.size ? (nextAt - ctx().currentTime) * 1000 : 0) + 300) : 900; setTimeout(() => { if (S.turnSeq === mySeq && !S.over && !S.busy) heroineInitiative(rec); }, waitMs); }
  rec.affectionAfter = S.affection;
  S.turns.push(rec);
  fetch('/api/log', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec) }).catch(() => {});

  turnsLeft();
  // 結末は、最後の返事の声が鳴り終わってから（文字と声がずれないように）
  if (endKind) { const waitMs = rec.tts && rec.tts.kind !== 'none' ? Math.max(300, (playing.size ? (nextAt - ctx().currentTime) * 1000 : 0) + 400) : 600; setTimeout(() => ending(endKind === 'auto' ? undefined : endKind), waitMs); }
}

async function heroineInitiative(prevRec) {
  S.lastInitiativeTurn = S.turn; const mySeq = S.turnSeq;
  try {
    const w = await post('/api/words', { history: S.history, line: '', initiative: true, affection: S.affection, playerName: S.playerName, heroineName: S.heroineName, topics: S.topics, episode: S.episode && S.episode.id });
    if (S.turnSeq !== mySeq || S.over) return; // 待っている間に次の手が送られた
    const text = plain(w.line);
    add('her', text);
    S.history.push({ role: 'assistant', text: text });
    S.probe = true; prevRec.initiative = { line: text, mood: w.mood };
    setFace(w.mood, null, { quiet: true });
    if ($('voice').checked && w.line) { try { await speak(w.line, w.mood, null, { kind: 'line', affection: S.affection }); } catch (e) { /* 声は無くても進む */ } }
  } catch (e) { /* 振れなければ黙る */ }
}
function ending(force) {
  const e = cfg.scenario.endings;
  const kind = force || (e.perfect && S.affection >= e.perfect.min ? 'perfect' : S.affection >= e.good.min ? 'good' : S.affection >= e.normal.min ? 'normal' : 'bad');
  $('ending').classList.toggle('perfect', kind === 'perfect');
  if (kind === 'perfect') setFace('joy', '', { strong: true });
  S.over = true; S.busy = true; $('send').disabled = true;
  if (kind === 'leave') { add('her', e.leave.text); S.history.push({ role: 'assistant', text: e.leave.text }); }
  const eps0 = (cfg.scenario.episodes || []); const wasUnlocked = episodesUnlocked(eps0);
  if (S.episode) memMark(S.episode.id, kind);
  $('endTitle').textContent = (S.episode ? S.episode.title + '：' : '') + { perfect:'パーフェクト', good:'達成', normal:'ふつう', bad:'失敗', leave:'失敗（帰ってしまった）' }[kind] + (document.body.classList.contains('debug') ? '（好感度 ' + S.affection + '）' : '');
  $('endText').textContent = e[kind].text;
  speakFixed(e[kind].text, kind === 'perfect' || kind === 'good' ? 'joy' : kind === 'normal' ? 'calm' : 'upset');
  const t = S.turns, avg = (k) => { const xs = t.map((r) => r[k]).filter((x) => x != null); return xs.length ? sec(xs.reduce((a, b) => a + b, 0) / xs.length) : '—'; };
  const eps = eps0; const unlocked = episodesUnlocked(eps); const seenN = eps.filter((e) => episodeDone(e.id)).length; const openN = eps.filter((e) => !e.locked || unlocked).length;
  const goodN = eps.filter((e) => !e.locked).filter((e) => { const s = (memGet().seen || {})[e.id] || {}; return (s.good || 0) + (s.perfect || 0) > 0; }).length;
  $('endNote').textContent = '開いた話題: ' + (S.topics.length ? S.topics.map((t) => TOPIC_JA[t] || t).join('・') : 'なし') + ' ／ 見たはじまり ' + seenN + '/' + openN
    + (!wasUnlocked && unlocked && eps.some((e) => e.locked) ? ' ／ 新しいはじまりが開いた' : seenN < openN ? ' ／ まだ見ていないはじまりがある' : !unlocked && eps.some((e) => e.locked) ? ' ／ 5 つ目は ' + UNLOCK_HOW + ' で開く（達成 ' + goodN + '/' + eps.filter((e) => !e.locked).length + '）' : '');
  $('endStats').textContent = '顔の平均 ' + avg('tFace') + (t.some((r) => r.tSfx != null) ? ' ・ 一言の平均 ' + avg('tSfx') : '') + ' ・ 言葉の平均 ' + avg('tWords') + (t.some((r) => r.tVoice != null) ? ' ・ 声の平均 ' + avg('tVoice') : '');
  $('ending').style.display = 'flex';
}

$('form').addEventListener('submit', (ev) => { ev.preventDefault(); turn($('input').value); });
$('input').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); if (S && S.waitOpen && !$('input').value.trim()) { openingLine(); return; } turn($('input').value); } });
$('input').addEventListener('input', schedulePeek);
function toTitle() { $('ending').style.display = 'none'; $('backlog').style.display = 'none'; $('quit').style.display = 'none'; $('help').style.display = 'none'; $('title').style.display = 'flex'; document.body.classList.add('on-title'); if (S) { S.over = true; S.busy = true; } peekSeq++; if (typeof window.__renderEpisodes === 'function') window.__renderEpisodes(); }
$('again').onclick = toTitle;
$('quitBtn').onclick = () => { if (!S || S.over) toTitle(); else $('quit').style.display = 'flex'; };
$('quitYes').onclick = () => { $('quit').style.display = 'none'; toTitle(); };
$('quitNo').onclick = () => { $('quit').style.display = 'none'; };
$('logBtn').onclick = () => { $('backlog').style.display = 'flex'; scrollDown(); };
$('backlogClose').onclick = () => { $('backlog').style.display = 'none'; };
for (const id of ['backlog', 'help', 'quit']) $(id).addEventListener('click', (ev) => { if (ev.target === $(id)) $(id).style.display = 'none'; });

fetch('/api/config').then((r) => r.json()).then((c) => {
  cfg = c;
  $('name').textContent = c.scenario.persona['名前'];
  const voiceLabel = c.has.tts ? c.ttsModel : ('speechSynthesis' in window ? 'ブラウザの合成音声（仮）' : 'なし');
  $('models').textContent = '反射 ' + (c.has.jev ? 'jev-latest' : 'なし') + ' ／ 言葉 ' + (c.has.llm ? c.llmModel : 'なし') + ' ／ 声 ' + voiceLabel;
  if (!c.has.tts && !c.sfxReady && !('speechSynthesis' in window)) { $('voice').checked = false; $('voice').disabled = true; }
  if (!c.has.jev) { document.querySelector('input[value=llm]').checked = true; document.querySelector('input[value=reflex]').disabled = true; }
  $('foot').innerHTML = '台詞は判定のため TypeSafe AI（Jev）と Anthropic（Claude）へ、声を Gemini で出すときは Google へ送られます。' + (PEEK ? '打っている途中の文も Jev に送られます。' : '') + '各ターンの計測は <code>_out/turns.jsonl</code> に残ります。';
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
  setBackground(null);
  prepareCutouts();
  if (c.ttsDown) enterSubtitleMode('今日の上限・あと ' + (c.ttsRetryIn || '?'));
  // デバッグ表示（?debug=1 か チェック）
  const dbg = new URLSearchParams(location.search).get('debug') === '1';
  const setDbg = (on) => { document.body.classList.toggle('debug', on); $('debugToggle').checked = on; $('debugToggle2').checked = on; };
  setDbg(dbg);
  $('debugToggle').addEventListener('change', () => setDbg($('debugToggle').checked));
  $('debugToggle2').addEventListener('change', () => setDbg($('debugToggle2').checked));
  // 遊び方
  const hb = $('helpBody'); hb.innerHTML = '';
  if (c.scenario.goal) { const dt = document.createElement('dt'); dt.textContent = '目標'; const dd = document.createElement('dd'); dd.textContent = c.scenario.goal; hb.appendChild(dt); hb.appendChild(dd); }
  for (const [k, v] of Object.entries(c.scenario.rules || {})) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; hb.appendChild(dt); hb.appendChild(dd); }
  $('browserVoiceToggle').checked = useBrowserVoice;
  $('browserVoiceToggle').addEventListener('change', () => { useBrowserVoice = $('browserVoiceToggle').checked; try { localStorage.setItem('jevkano_browser_voice', useBrowserVoice ? '1' : '0'); } catch {} });
  $('helpBtn').onclick = () => { $('help').style.display = 'flex'; };
  $('helpClose').onclick = () => { $('help').style.display = 'none'; };
  // 開始画面
  if (c.scenario.title) { $('appTitle').textContent = c.scenario.title; $('titleName').textContent = c.scenario.title; document.title = c.scenario.title; }
  if (c.app && c.app.env === 'stg') document.title = '[stg] ' + document.title; // 本番のタブと見分ける
  const sel = $('heroineName'); if ((c.scenario.names || []).length <= 1) { sel.style.display = 'none'; $('heroineFixed').style.display = ''; $('heroineFixed').value = (c.scenario.names || [c.scenario.persona['名前']])[0]; $('heroineFixed').title = '当面はこの一人'; }
  for (const n of (c.scenario.names || [c.scenario.persona['名前']])) { const o = document.createElement('option'); o.value = n; const v = (c.voices || {})[n]; o.textContent = n + (v && v.note ? '（声: ' + v.note.replace(/^[A-Z]: /, '') + '）' : ''); sel.appendChild(o); }
  const epSel = $('episode');
  const renderEpisodes = () => {
    epSel.innerHTML = ''; const mem = memGet();
    const auto = document.createElement('option'); auto.value = ''; auto.textContent = 'まだ見ていないものから'; epSel.appendChild(auto);
    const unlocked = episodesUnlocked(c.scenario.episodes || [], mem);
    for (const ep of (c.scenario.episodes || [])) { const o = document.createElement('option'); o.value = ep.id; const locked = ep.locked && !unlocked; o.disabled = !!locked; o.textContent = (locked ? '？？？（' + UNLOCK_HOW + 'で開く）' : ep.title) + (episodeDone(ep.id) ? ' ✓' : ''); epSel.appendChild(o); }
  };
  renderEpisodes(); window.__renderEpisodes = renderEpisodes;
  const pickEpisode = () => { const eps = (c.scenario.episodes || []); const mem = memGet(); if (epSel.value) return eps.find((e) => e.id === epSel.value); const unlocked = episodesUnlocked(eps, mem); const open = eps.filter((e) => !e.locked || unlocked); return open.find((e) => !episodeDone(e.id)) || open[Math.floor(Math.random() * open.length)] || eps[0]; };
  $('titleGoal').textContent = '目標: ' + (c.scenario.goal || '') + ' 失敗: 親しさが下がりきる、または彼女が帰ってしまう。';
  try { const saved = localStorage.getItem('reflex_galge_player'); if (saved) $('playerName').value = saved; } catch {}
  S = null;
  $('startBtn').onclick = () => {
    const pn = $('playerName').value.trim() || 'あなた';
    try { localStorage.setItem('reflex_galge_player', pn); } catch {}
    for (const k of Object.keys(sfxBuf)) delete sfxBuf[k];
    S = { playerName: pn, heroineName: sel.value, episode: pickEpisode() };
    $('title').style.display = 'none'; document.body.classList.remove('on-title');
    reset();
    prefetchSfx();
  };
  $('playerName').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); $('startBtn').click(); } });
  fitWin();
  // ?auto=1: 記録用の自動再生（開始 → モノローグを飛ばす → 候補の 1 つ目を言う）。?auto=pat なら触れる
  const auto = new URLSearchParams(location.search).get('auto');
  if (auto) setTimeout(() => {
    if (!$('playerName').value) $('playerName').value = '拓海';
    epSel.value = 'cleanup'; $('startBtn').click();
    setTimeout(() => { while (S && S.waitOpen) openingLine(); const act = (c.scenario.actions || []).find((a) => a.id === auto); if (act) turn('', act); else turn(((S.episode && S.episode.suggestions) || c.scenario.suggestions)[0][0]); }, 600);
  }, 900);
});
</script>
