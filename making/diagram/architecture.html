<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>#Jevカノ の仕組み（図）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2a2d3f; --sub:#6b6f85; --jev:#3b82c6; --jevL:#e3f0fb; --llm:#e8834a; --llmL:#fdeadb; --tts:#5c6b7a; --ttsL:#e9edf1; --line:#d9d2c5; }
  body { margin:0; background:#f5efe3; font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif; color:var(--ink); }
  .canvas { width:1280px; height:720px; box-sizing:border-box; padding:40px 60px; background:linear-gradient(180deg,#fbe7cf 0%, #f5efe3 45%); position:relative; }
  h1 { font-weight:900; font-size:34px; margin:0; letter-spacing:.04em; }
  h1 small { font-weight:500; font-size:18px; color:var(--sub); margin-left:16px; }
  .you { position:absolute; left:60px; top:130px; width:170px; text-align:center; }
  .you .pill { background:#e6f0fb; border:1px solid #cfe0f5; border-radius:18px; padding:16px 10px; font-size:20px; font-weight:700; line-height:1.5; }
  .you .sub { color:var(--sub); font-size:14px; margin-top:8px; }
  /* 3 つの層: 時間の長さ＝横幅 */
  .row { position:absolute; left:280px; right:60px; height:110px; }
  .box { position:absolute; top:0; height:110px; border-radius:20px; display:flex; align-items:center; gap:18px; padding:0 22px; box-shadow:0 6px 18px rgba(0,0,0,.08); }
  .box .who { font-weight:900; font-size:26px; color:#fff; border-radius:999px; padding:6px 18px; letter-spacing:.06em; white-space:nowrap; }
  .box .what { font-weight:700; font-size:26px; white-space:nowrap; }
  .box .t { position:absolute; right:18px; top:-30px; font-size:17px; font-weight:700; color:var(--sub); white-space:nowrap; }
  .jev { background:var(--jevL); border:3px solid var(--jev); } .jev .who { background:var(--jev); } .jev .what { color:#1f4f85; }
  .llm { background:var(--llmL); border:3px solid var(--llm); } .llm .who { background:var(--llm); } .llm .what { color:#8a3c12; }
  .tts { background:var(--ttsL); border:3px solid var(--tts); } .tts .who { background:var(--tts); } .tts .what { color:#33404c; }
  .result { position:absolute; left:100%; margin-left:22px; top:0; height:110px; display:flex; align-items:center; font-size:22px; font-weight:700; color:var(--jev); white-space:nowrap; }
  /* 本音の矢印 */
  .honne { position:absolute; left:calc(280px + 395px); width:4px; background:var(--jev); opacity:.6; border-radius:2px; }
  .honne::after { content:""; position:absolute; left:-8px; bottom:-4px; border:10px solid transparent; border-top:14px solid var(--jev); }
  .honne .lbl { position:absolute; left:16px; top:50%; transform:translateY(-50%); background:#fff; border:2px solid var(--jev); color:var(--jev); border-radius:999px; padding:4px 14px; font-size:18px; font-weight:700; white-space:nowrap; }
  .arrow { position:absolute; left:236px; top:180px; font-size:34px; color:var(--sub); }
  .foot { position:absolute; left:60px; right:60px; bottom:34px; font-size:18px; color:var(--sub); font-weight:500; text-align:center; }
</style>
</head>
<body>
<div class="canvas">
  <h1>#Jevカノ <small>顔が先に動いて、言葉はあとから来る</small></h1>

  <div class="you">
    <div class="pill">話しかける<br>触れる</div>
    <div class="sub">あなた</div>
  </div>
  <div class="arrow">→</div>

  <div class="row" style="top:130px">
    <div class="box jev" style="left:0; width:430px"><span class="t">0.2 秒</span><span class="who">Jev</span><span class="what">彼女の本音を判断</span>
      <div class="result">→ 表情・一言</div></div>
  </div>

  <div class="row" style="top:300px">
    <div class="box llm" style="left:0; width:560px"><span class="t">4 秒</span><span class="who">Claude</span><span class="what">彼女の言葉を書く</span>
      <div class="result" style="color:#8a3c12">→ 台詞</div></div>
  </div>

  <div class="row" style="top:470px">
    <div class="box tts" style="left:0; width:760px"><span class="t">5.5 秒</span><span class="who">Gemini</span><span class="what">彼女の声にする</span>
      <div class="result" style="color:#33404c">→ 声</div></div>
  </div>

  <div class="honne" style="top:240px; height:230px"><span class="lbl">同じ本音を渡す</span></div>

  <div class="foot">時間差はあっても、顔・一言・言葉・声は同じ本音でそろう</div>
</div>
</body>
</html>
